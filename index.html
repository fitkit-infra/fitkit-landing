<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fitkit — where fashion brands get found</title>
    <meta
      name="description"
      content="Fitkit is where shoppers browse outfits across every brand at once. List your brand and get found by the people already looking."
    />
    <meta name="theme-color" content="#FAF8F5" />
    <!-- Theme is applied before first paint, so a returning visitor on dark
         never sees a frame of paper. Kept inline and tiny on purpose: anything
         module-loaded runs after the first paint. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('fitkit-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.dataset.theme = 'dark';
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fitkit — where fashion brands get found" />
    <meta
      property="og:description"
      content="Get found by the people already looking. Free, no exclusivity, live in minutes."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
